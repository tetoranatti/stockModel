name: Daily JPX Recorder

on:
  schedule:
    # 平日（月〜金）の 日本時間 17:45 (UTC 08:45) に自動実行
    - cron: '45 8 * * 1-5'
  workflow_dispatch: # GitHubのWeb画面から手動テスト実行できるトリガー

jobs:
  record:
    runs-on: ubuntu-latest
    permissions:
      contents: write # リポジトリへのプッシュ権限を付与

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: JPX日次レコーダーの実行
        run: python daily_jpx_recorder.py

      - name: DBファイルの変更をコミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jpx_daily_features_db.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update JPX DB: $(date +'%Y-%m-%d')" && git push)